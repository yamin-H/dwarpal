services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dwarpal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwarpal_dev}
      POSTGRES_DB: dwarpal
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwarpal"]
      interval: 5s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
        EMBEDDING_MODEL: ${DWARPAL_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
    env_file: .env
    environment:
      DWARPAL_PRICES_CONFIG: ${DWARPAL_PRICES_CONFIG:-}
      DWARPAL_ROUTING_CONFIG: ${DWARPAL_ROUTING_CONFIG:-}
      DWARPAL_QDRANT_URL: http://qdrant:6333
      DWARPAL_QDRANT_API_KEY: ${QDRANT_API_KEY:-dwarpal_dev}
      DWARPAL_DATABASE_URL: postgresql+psycopg://dwarpal:${POSTGRES_PASSWORD:-dwarpal_dev}@postgres:5432/dwarpal
      DWARPAL_MOCK_DELAY_MS: ${DWARPAL_MOCK_DELAY_MS:-0}
      DWARPAL_REDIS_URL: redis://:${REDIS_PASSWORD:-dwarpal_dev}@redis:6379/0
    volumes:
      - ./config:/srv/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:8001:8000"   # DEV ONLY: direct access for admin. Remove in production.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      retries: 10
      start_period: 90s

  kong:
    image: kong:3.7
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "127.0.0.1:8000:8000"       # change to 0.0.0.0 only when you deploy
    depends_on:
      gateway:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-dwarpal_dev} --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dwarpal_dev}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      retries: 10
    # no published port: only the gateway can reach Redis

  qdrant:
    image: qdrant/qdrant:v1.12.4     # if this tag is not found, pin any current 1.12+ release
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-dwarpal_dev}
    volumes:
      - qdrant_data:/qdrant/storage
    # no published port: only the gateway can reach it

  prometheus:
    image: prom/prometheus:v2.53.0     # if the tag is not found, pin any current release
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      gateway:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0      # if the tag is not found, pin any current release
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  qdrant_data:
  prometheus_data: