groups:
  - name: dwarpal
    rules:
      - alert: ProviderCircuitOpen
        expr: dwarpal_provider_circuit_open == 1
        labels:
          severity: warning
        annotations:
          summary: "Circuit open for {{ $labels.model }}: traffic is on its fallbacks"

      - alert: HighUpstreamErrorRate
        expr: |
          sum(rate(dwarpal_requests_total{status="error"}[5m]))
            / clamp_min(sum(rate(dwarpal_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of chat requests are failing"

      - alert: SlowFirstToken
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(dwarpal_ttft_seconds_bucket{source!="cache"}[5m]))) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 time to first token is above 5s"

      - alert: GatewayDown
        expr: up{job="dwarpal-gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus cannot scrape the gateway"

      - alert: ServerErrors
        expr: sum(rate(dwarpal_http_responses_total{status_class="5xx"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The gateway is returning 5xx responses"